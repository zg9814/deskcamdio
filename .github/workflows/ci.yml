name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install (locked)
        run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Types (core/services/platform)
        run: uv run mypy
      - name: Tests (branch coverage gate)
        run: uv run pytest --cov=deskcamdio --cov-branch --cov-fail-under=85
